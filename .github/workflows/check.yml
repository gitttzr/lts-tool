name: Shell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n linux-server-tool.sh install.sh test-linux-server-tool.sh test-health.sh test-bbr.sh
      - name: Verify download checksum
        run: sha256sum --check linux-server-tool.sh.sha256
      - name: Run isolated regression tests
        run: |
          bash test-linux-server-tool.sh
          bash test-health.sh
          bash test-bbr.sh
          bash test-shortcut.sh
          bash test-dns.sh
          bash test-key-input.sh
          bash test-key-expiry.sh
  sshd-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@v4
      - name: Test real OpenSSH recovery in disposable container
        run: |
          docker run --rm -e LTS_SSHD_TEST_CONTAINER=1 -v "$PWD:/repo:ro" "${{ matrix.image }}" bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server openssh-client iproute2
            bash /repo/test-sshd-container.sh
          '
