name: Shell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n linux-server-tool.sh install.sh test-linux-server-tool.sh
      - name: Verify download checksum
        run: sha256sum --check linux-server-tool.sh.sha256
      - name: Run isolated regression tests
        run: bash test-linux-server-tool.sh
